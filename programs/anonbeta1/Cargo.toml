[package]
name = "anonbeta1"
version = "0.1.0"
description = "Anonmesh beacon registry program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "anonbeta1"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
arcium-client = { version = "=0.9.3", default-features = false }
arcium-macros = { version = "=0.9.3" }
arcium-anchor = { version = "=0.9.3" }
blake3 = "=1.8.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
