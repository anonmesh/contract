[package]
name = "anonbeta1"
version = "0.2.0"
description = "Anonmesh RNS beacon registry with Arcium-private binding and relay stats"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "anonbeta1"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "arcium-anchor/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
arcium-client = { version = "=0.9.3", default-features = false }
arcium-macros = { version = "=0.9.3" }
arcium-anchor = { version = "=0.9.3" }
solana-keccak-hasher = "2.2.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
